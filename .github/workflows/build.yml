name: Build CNST Junction APK

"on":
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Get project files
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip autoconf automake autopoint ccache cmake g++ gcc libffi-dev libltdl-dev libtool libssl-dev make patch pkg-config zlib1g-dev

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip setuptools wheel
      pip install buildozer cython==0.29.36

  - name: Build Android APK
    run: buildozer -v android debug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: CNST-Junction-APK
      path: bin/*.apk
      if-no-files-found: error
